<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MR Digital – iOS Apps & Support</title>

  <meta
    name="description"
    content="Support- und Informationsseite für die iOS-Apps von MR Digital."
  >

  <style>
    :root {
      --bg: #f5f7f6;
      --card: #ffffff;
      --text: #171917;
      --muted: #626862;
      --accent: #146c36;
      --accent-dark: #0f552b;
      --border: #e1e6e2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 18px 64px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .brand {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1.1;
    }

    p {
      color: var(--muted);
      font-size: 17px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: var(--accent-dark);
    }

    .button.secondary {
      background: #eef2ef;
      color: var(--text);
    }

    .button.secondary:hover {
      background: #e3e9e5;
    }

    .info {
      margin-top: 24px;
      padding: 0 4px;
      font-size: 14px;
      color: var(--muted);
    }

    .info a {
      color: var(--accent);
    }

    @media (max-width: 560px) {
      main {
        padding-top: 24px;
      }

      .hero {
        padding: 24px;
      }

      .links {
        flex-direction: column;
      }

      .button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<main>

  <section class="hero">

    <span class="brand">MR Digital</span>

    <h1>iOS Apps & Support</h1>

    <p>
      Support- und Informationsseite für die von MR Digital
      entwickelten iOS-Apps.
    </p>

    <div class="links">

      <a class="button" href="mailto:mr-digital@gmx.net">
        Support kontaktieren
      </a>

      <a class="button secondary" href="datenschutz.html">
        Datenschutz
      </a>

      <a class="button secondary" href="impressum.html">
        Impressum
      </a>

    </div>

  </section>

  <p class="info">
    Bei Fragen zu einer App bitte den App-Namen und nach Möglichkeit
    die verwendete App-Version in der Support-Anfrage angeben.
  </p>

</main>

</body>
</html>
