<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RingTrace – Support</title>
  <meta name="description" content="Support für RingTrace, die iOS-App zur Dokumentation von Schießsporttraining.">
  <style>
    :root{--bg:#f5f7f6;--card:#fff;--text:#171917;--muted:#626862;--accent:#0f6675;--accent-dark:#0b5360;--border:#e1e6e2}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
    main{max-width:860px;margin:0 auto;padding:48px 18px 64px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.04)}
    .brand{display:inline-block;margin-bottom:8px;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
    h1{margin:0 0 12px;font-size:clamp(34px,7vw,48px);line-height:1.1}
    p{color:var(--muted);font-size:17px}
    .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
    .button{display:inline-block;padding:12px 18px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;transition:background .2s ease}
    .button:hover{background:var(--accent-dark)}
    .button.secondary{background:#eef2ef;color:var(--text)}
    .button.secondary:hover{background:#e3e9e5}
    .info{margin-top:24px;padding:0 4px;font-size:14px;color:var(--muted)}
    @media(max-width:560px){main{padding-top:24px}.card{padding:24px}.links{flex-direction:column}.button{width:100%;text-align:center}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <span class="brand">MR Digital</span>
    <h1>RingTrace Support</h1>
    <p>RingTrace unterstützt die Dokumentation und Auswertung von legalem Schießsporttraining auf dem iPhone.</p>
    <div class="links">
      <a class="button" href="mailto:mr-digital@gmx.net?subject=RingTrace%20Support">Support kontaktieren</a>
      <a class="button secondary" href="datenschutz.html">Datenschutz</a>
      <a class="button secondary" href="impressum.html">Impressum</a>
    </div>
  </section>
  <p class="info">Bei Support-Anfragen bitte die verwendete RingTrace-Version und nach Möglichkeit die Build-Nummer angeben.</p>
</main>
</body>
</html>
